services:
  # Backend API - Lambda Container Image
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: url-shortener-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - AllowedOrigins=http://localhost:3000
      - BaseUrl=http://localhost:5000
      # JWT Secret (use strong secret in production, stored in AWS Secrets Manager)
      - JwtSettings__Secret=${JWT_SECRET:-your-super-secret-key-at-least-32-chars-long}
      - JwtSettings__Issuer=url-shortener-api
      - JwtSettings__Audience=url-shortener-client
      - JwtSettings__ExpirationInMinutes=60
      # DynamoDB table names (match Terraform naming convention)
      - DYNAMODB_USERS_TABLE=url-shortener-dev-users
      - DYNAMODB_URLS_TABLE=url-shortener-dev-urls
      # AWS Configuration for LocalStack
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      # X-Ray (optional)
      - AWS_XRAY_DAEMON_ADDRESS=127.0.0.1:2000
    networks:
      - url-shortener-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    depends_on:
      localstack:
        condition: service_healthy

  # Frontend React + Nginx
  frontend:
    build:
      context: ./frontend
    container_name: url-shortener-frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    networks:
      - url-shortener-net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # LocalStack for local DynamoDB
  localstack:
    image: localstack/localstack:3.5
    container_name: url-shortener-localstack
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=dynamodb
      - DEBUG=1
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - "./localstack-init:/etc/localstack/init/ready.d"
      - "localstack-data:/var/lib/localstack"
    networks:
      - url-shortener-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # X-Ray Daemon (for local tracing)
  xray-daemon:
    image: public.ecr.aws/xray-daemon/aws-xray-daemon:latest
    container_name: url-shortener-xray
    ports:
      - "2000:2000/udp"
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    networks:
      - url-shortener-net
    command: ["-o", "-b", "0.0.0.0:2000"]
    profiles:
      - tracing

networks:
  url-shortener-net:
    driver: bridge

volumes:
  localstack-data: